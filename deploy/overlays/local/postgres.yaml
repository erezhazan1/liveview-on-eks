# LOCAL ONLY - stands in for the externally-provided RDS. Never part of a real overlay.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      containers:
        - name: postgres
          image: postgres:14-alpine
          env:
            - {name: POSTGRES_PASSWORD, value: postgres}
            - {name: POSTGRES_DB, value: demo_prod}
          ports: [{containerPort: 5432}]
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector: {app: postgres}
  ports: [{port: 5432}]
