apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: demo
spec:
  maxUnavailable: 1
  # NOT auto-filled by kustomize's labels transformer (verified empirically via `kustomize
  # build`: PodDisruptionBudget spec.selector isn't in its default fieldSpecs) - explicit
  # here, since an empty selector matches ALL pods in the namespace, which is dangerous.
  selector:
    matchLabels:
      app.kubernetes.io/name: demo
      app.kubernetes.io/part-of: liveview-assignment
